name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,export]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Registry
        run: |
          model-lab registry validate --check-schema-file
          model-lab registry audit
      - name: Tests (no network, no GPU)
        run: pytest -q -m "not integration and not gpu"
      - name: CPU lab smoke runs
        run: |
          python labs/04_point_cloud_basics/explore_scene.py --out outputs/lab04
          python labs/05_lidar_3d_baseline/run_cluster_baseline.py --scenes 5
          python labs/09_quantization_and_export/onnx_parity_toy.py --out outputs/lab09
