  # ---------------------------------------------------------------- LiDAR 3D detectors
  - id: pointpillars-openpcdet
    name: PointPillars (OpenPCDet)
    aliases: [pointpillars]
    family: PointPillars
    role: task_detector
    tasks: [lidar_3d_detection]
    modalities: [lidar]
    summary: >-
      Pillar encoder (PointNet per vertical column) scattered to a BEV pseudo-image, then a 2D CNN
      + anchor head. No sparse convolution needed – the easiest LiDAR detector to deploy.
    paper: {title: "PointPillars: Fast Encoders for Object Detection from Point Clouds", year: 2019, arxiv: "1812.05784", url: "https://arxiv.org/abs/1812.05784"}
    links:
      code: https://github.com/open-mmlab/OpenPCDet
    licensing:
      code_license: Apache-2.0
      dataset_terms: "KITTI checkpoints: KITTI is CC BY-NC-SA 3.0; nuScenes checkpoints: nuScenes non-commercial terms."
      commercial_use: unclear_legal_review
      notes: Code permissive; released weights inherit dataset restrictions – treat as research-only.
    io_contract:
      framework: OpenPCDet (PyTorch, custom CUDA ops)
      input: "(N, 4) x, y, z, intensity in LiDAR frame; KITTI range [0, -39.68, -3, 69.12, 39.68, 1], voxel 0.16x0.16x4"
      output: 7-DoF boxes [x, y, z, l, w, h, yaw] (gravity centre), scores, labels
      coordinate_convention: "x fwd, y left, z up; matches model_lab.data.geometry"
      postprocessing: rotated NMS
    pretraining: {data: KITTI or nuScenes (per config), domain_fit: automotive}
