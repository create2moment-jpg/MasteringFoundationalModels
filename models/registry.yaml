  # ---------------------------------------------------------------- camera-LiDAR fusion
  - id: bevfusion-mit
    name: BEVFusion (MIT HAN Lab)
    aliases: [bevfusion]
    family: BEVFusion
    role: fusion_model
    tasks: [camera_lidar_3d_detection, bev_map_segmentation]
    modalities: [camera_multi_view, lidar]
    summary: >-
      Lifts camera features to BEV (LSS-style depth distribution + efficient BEV pooling), fuses with a
      sparse-conv LiDAR BEV map by concatenation + conv, then a TransFusion-style head.
    paper: {title: "BEVFusion: Multi-Task Multi-Sensor Fusion with Unified Bird's-Eye View Representation", year: 2022, arxiv: "2205.13542", url: "https://arxiv.org/abs/2205.13542"}
    links: {code: "https://github.com/mit-han-lab/bevfusion"}
    licensing:
      code_license: Apache-2.0 (secondary); repository archived
      dataset_terms: nuScenes non-commercial for official weights
      commercial_use: unclear_legal_review
    io_contract:
      input: 6 images + LiDAR sweeps + calibration (camera intrinsics, lidar2camera, ego poses) + image augmentation matrices
      output: 3D boxes (nuScenes 10 classes) and/or BEV map segmentation
    pretraining: {data: nuScenes, domain_fit: automotive}
    finetuning: {recipe_available: true, peft: unsupported}
    artifacts:
      official_pretrained: {status: not_verified, url: "https://github.com/mit-han-lab/bevfusion"}
      automotive_finetuned: {status: available_community, url: "https://huggingface.co/AutowareFoundation/bevfusion", notes: "Autoware ONNX models (LiDAR-only and camera-LiDAR, 5 classes, 'T4base_120m' family) – different training data and classes from the paper."}
      quantized: {status: not_verified, notes: "NVIDIA CUDA-BEVFusion reports INT8/FP16 TensorRT (secondary)."}
      onnx_export: {status: available_community, url: "https://huggingface.co/AutowareFoundation/bevfusion", notes: "Pre/post-processing (voxelization, NMS) run outside the ONNX graphs in the Autoware node."}
      engine: {status: build_recipe_available, url: "https://github.com/NVIDIA-AI-IOT/Lidar_AI_Solution", notes: "CUDA-BEVFusion; Autoware builds TensorRT engines from ONNX on first launch."}
    deployment:
      export_formats: [onnx]
      runtimes: [pytorch, tensorrt, autoware_ros2]
      known_traps:
        - "Sparse conv needs TensorRT plugins (Autoware: spconv_cpp / autoware_tensorrt_plugins)."
        - "BEV pooling is a custom CUDA op; camera-to-BEV geometry must be recomputed if calibration changes."
        - "Camera images undistorted/cropped (Autoware ROI 576x384 from 1440x1080) – resolution changes need retraining or careful re-calibration."
    recommendation_context: Reference camera-LiDAR fusion model with the most mature public deployment paths.
    card: cards/bevfusion-mit.md
    caveats:
      - "Qualcomm AI Hub publishes a camera-only BEVFusion-derived export (huggingface.co/qualcomm/BEVFusion) – different model scope; do not confuse."
    verification:
      last_verified: 2026-10-30
      status: partially_verified
      method: HF model cards (Autoware, Qualcomm) read; MIT repo licence and NVIDIA deployment via web search (secondary).
      evidence:
        - {claim: "Autoware BEVFusion ONNX, Apache-2.0, TensorRT engines built on first launch, spconv plugins", url: "https://huggingface.co/AutowareFoundation/bevfusion", source_type: model_card, accessed: 2026-10-30}
        - {claim: "mit-han-lab/bevfusion Apache-2.0, archived; points to NVIDIA TensorRT deployment", url: "https://awesome.ecosyste.ms/projects/github.com%2Fmit-han-lab%2Fbevfusion", source_type: secondary, accessed: 2026-10-30}
        - {claim: "Qualcomm camera-BEV export, Apache-2.0", url: "https://huggingface.co/qualcomm/BEVFusion", source_type: model_card, accessed: 2026-10-30}
