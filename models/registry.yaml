# Autonomous-driving perception model registry.
#
# Schema: src/model_lab/registry/schema.py (JSON Schema: models/registry.schema.json)
# Validate: model-lab registry validate --check-schema-file
#
# Evidence rules (docs/02_model_selection_playbook.md#evidence-rules):
#   * verification.status = verified_primary only when licence, weights location and
#     key I/O facts were checked against a primary source on `last_verified`.
#   * Facts recorded from prior knowledge are marked not_verified / PRIOR_KNOWLEDGE and
#     live in the verification queue (`model-lab registry audit`).
#   * Benchmarks: only numbers transcribed from a primary source are filled in; everything
#     else is left null with a pointer. Nothing here is a local reproduction yet.
#
# Research session 2026-10-30: Hugging Face Hub API reachable via connector; github.com,
# arxiv.org and vendor sites were NOT directly reachable from the build container, so
# GitHub-hosted facts come from web-search snippets (SECONDARY) or prior knowledge.

schema_version: 1
research_baseline: 2026-10-30

models:
  # ---------------------------------------------------------------- image encoders
  - id: dinov2-vitb14
    name: DINOv2 ViT-B/14
    aliases: [facebook/dinov2-base]
    family: DINOv2
    role: foundation_encoder
    tasks: [image_features]
    modalities: [camera_mono]
    summary: >-
      Self-supervised ViT image encoder (patch 14) whose frozen dense features transfer well
      to detection, segmentation and depth; the default "strong frozen backbone" baseline.
    paper: {title: "DINOv2: Learning Robust Visual Features without Supervision", year: 2023, arxiv: "2304.07193", url: "https://arxiv.org/abs/2304.07193"}
    links:
      code: https://github.com/facebookresearch/dinov2
      model_card: https://huggingface.co/facebook/dinov2-base
      weights: https://huggingface.co/facebook/dinov2-base
    licensing:
      code_license: Apache-2.0
      weight_license: Apache-2.0
      commercial_use: permissive
      gated: false
      notes: Weight licence from HF license tag (verified). Code licence from prior knowledge.
    io_contract:
      framework: PyTorch / transformers (AutoModel)
      input: RGB float tensor (B, 3, H, W), H and W multiples of 14; ImageNet mean/std normalisation
      output: last_hidden_state (B, 1 + (H/14)*(W/14), 768) – CLS token + patch tokens (no registers in this variant)
      preprocessing: AutoImageProcessor default resizes/crops to 224; for driving images keep aspect ratio and use e.g. 518x924 or tile
    pretraining:
      data: LVD-142M curated web images (per paper)
      domain_fit: generic_web_images
      notes: Not driving data; ego-vehicle viewpoints, night and rain are under-represented. Validate on BDD100K/nuScenes crops before relying on it.
    size: {params_m: 86.6, source: hub_metadata}
    finetuning:
      recipe_available: true
      peft: supported
      notes: Linear probe / frozen-encoder head is the first experiment; LoRA on attention via PEFT works for ViTs. See recipes/image_encoders.
    artifacts:
      official_pretrained: {status: available_official, url: "https://huggingface.co/facebook/dinov2-base"}
      automotive_finetuned: {status: not_verified, notes: No official driving fine-tune known; search queue.}
      quantized: {status: not_verified}
      onnx_export: {status: requires_local_build, notes: "Standard ViT ops; export with torch.onnx (opset >= 17). Dynamic H/W requires interpolated position embeddings to trace cleanly."}
      engine: {status: requires_local_build, notes: Build TensorRT engine from your ONNX for your GPU/TRT version.}
    deployment:
      export_formats: [onnx]
      runtimes: [pytorch, onnxruntime, tensorrt]
      known_traps:
        - Position-embedding interpolation for non-224 inputs may be traced as a constant shape; export at deployment resolution.
    recommendation_context: First frozen image encoder to try for camera perception research with a permissive licence.
    card: cards/dinov2-vitb14.md
    verification:
      last_verified: 2026-10-30
      status: partially_verified
      method: HF Hub API (license tag, params, task); remaining fields prior knowledge.
      evidence:
        - {claim: "Apache-2.0 weights, 86.6M params, image-feature-extraction", url: "https://huggingface.co/facebook/dinov2-base", source_type: hub_metadata, accessed: 2026-10-30}

  - id: dinov3-vitb16
    name: DINOv3 ViT-B/16 (distilled, LVD-1689M)
    aliases: [facebook/dinov3-vitb16-pretrain-lvd1689m]
    family: DINOv3
    role: foundation_encoder
    tasks: [image_features]
    modalities: [camera_mono]
    summary: >-
      Successor to DINOv2 with a 7B teacher distilled into smaller ViTs/ConvNeXts; emphasises
      high-quality dense features at high resolution.
    paper: {title: "DINOv3", year: 2025, arxiv: "2508.10104", url: "https://arxiv.org/abs/2508.10104"}
    links:
      project: https://ai.meta.com/research/dinov3/
      code: https://github.com/facebookresearch/dinov3
      model_card: https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m
      weights: https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m
    licensing:
      weight_license: DINOv3 License (custom, HF tag "other")
      commercial_use: unclear_legal_review
      gated: true
      notes: Gated on HF (access request required). Custom licence text not read in this session – legal review before commercial use.
    io_contract:
      framework: PyTorch / transformers (AutoModel, dinov3_vit)
      input: RGB (B, 3, H, W), H and W multiples of 16
      output: CLS + register tokens + patch tokens (verify count of registers on the model card)
    pretraining:
      data: LVD-1689M web images (from checkpoint name); distilled from facebook/dinov3-vit7b16-pretrain-lvd1689m (HF base_model tag)
      domain_fit: generic_web_images
    size: {params_m: 85.7, source: hub_metadata}
    finetuning: {recipe_available: true, peft: supported, notes: Same recipes as DINOv2 once access is granted.}
    artifacts:
      official_pretrained: {status: gated, url: "https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m"}
      automotive_finetuned: {status: not_verified}
      quantized: {status: not_verified}
      onnx_export: {status: requires_local_build}
      engine: {status: requires_local_build}
    deployment: {export_formats: [onnx], runtimes: [pytorch, onnxruntime, tensorrt]}
    recommendation_context: Strong candidate to compare against DINOv2 in Lab 02 once licence terms are cleared.
    caveats:
      - Model card content could not be read (gated). Register-token count, normalisation and licence text are not verified.
    verification:
      last_verified: 2026-10-30
      status: partially_verified
      method: HF Hub API metadata (gated flag, license tag, params, base_model tag).
      evidence:
        - {claim: "gated, license other, 85.7M params, distilled from vit7b16", url: "https://huggingface.co/facebook/dinov3-vitb16-pretrain-lvd1689m", source_type: hub_metadata, accessed: 2026-10-30}

  - id: siglip2-base-p16-224
    name: SigLIP 2 Base/16 @224
    aliases: [google/siglip2-base-patch16-224]
    family: SigLIP
    role: foundation_encoder
    tasks: [image_features]
    modalities: [camera_mono, text]
    summary: >-
      Image-text (sigmoid-loss) dual encoder. Useful as a language-aligned image encoder
      (open-vocabulary heads, retrieval, auto-labelling) rather than as a dense detection backbone.
    paper: {title: "SigLIP 2: Multilingual Vision-Language Encoders with Improved Semantic Understanding, Localization, and Dense Features", year: 2025, arxiv: "2502.14786", url: "https://arxiv.org/abs/2502.14786"}
    links:
      model_card: https://huggingface.co/google/siglip2-base-patch16-224
      weights: https://huggingface.co/google/siglip2-base-patch16-224
    licensing: {weight_license: Apache-2.0, commercial_use: permissive, gated: false}
    io_contract:
      framework: PyTorch / transformers (AutoModel, siglip)
      input: image (B, 3, 224, 224) + tokenised text
      output: image and text embeddings; patch tokens available from the vision tower
    pretraining: {data: WebLI image-text pairs (per paper), domain_fit: generic_web_images}
    size: {params_m: 375.2, source: hub_metadata}
    finetuning: {recipe_available: false, peft: supported, notes: "375M is the full dual encoder; vision tower alone is ~86M."}
    artifacts:
      official_pretrained: {status: available_official, url: "https://huggingface.co/google/siglip2-base-patch16-224"}
      automotive_finetuned: {status: not_verified}
      quantized: {status: not_verified}
      onnx_export: {status: requires_local_build}
      engine: {status: requires_local_build}
    recommendation_context: Language-aligned encoder for open-vocabulary experiments and data mining; not first choice for dense 3D.
    caveats:
      - "224 px input is far below typical driving camera resolution; small/distant objects vanish. Test NaFlex/higher-res variants."
    verification:
      last_verified: 2026-10-30
      status: partially_verified
      method: HF Hub API metadata.
      evidence:
        - {claim: "Apache-2.0, 375.2M params", url: "https://huggingface.co/google/siglip2-base-patch16-224", source_type: hub_metadata, accessed: 2026-10-30}

  - id: c-radiov3-b
    name: C-RADIOv3-B
    aliases: [nvidia/C-RADIOv3-B]
    family: RADIO
    role: foundation_encoder
    tasks: [image_features]
    modalities: [camera_mono]
    summary: >-
      Agglomerative encoder distilled from several teachers (e.g. CLIP/SigLIP-, DINO- and SAM-style
      models) into one ViT; returns a summary token and dense spatial features at up to ~2K resolution.
    paper: {title: "RADIOv2.5: Improved Baselines for Agglomerative Vision Foundation Models", year: 2025, arxiv: "2412.07679", url: "https://arxiv.org/abs/2412.07679"}
    links:
      code: https://github.com/NVlabs/RADIO
      model_card: https://huggingface.co/nvidia/C-RADIOv3-B
      weights: https://huggingface.co/nvidia/C-RADIOv3-B
    licensing:
      weight_license: NVIDIA Open Model License Agreement (June 2024)
      commercial_use: conditional
      gated: false
      notes: Model card states "ready for commercial/non-commercial use" under the NVIDIA Open Model License; read the agreement.
    io_contract:
      framework: PyTorch / transformers with trust_remote_code=True
      input: RGB, resolutions up to 2048 in increments of 16 (model card); CLIPImageProcessor
      output: (summary (B, C), spatial_features (B, T, D)); reshape T to (H/16, W/16)
    pretraining: {data: Multi-teacher distillation; data mix per paper, domain_fit: generic_web_images}
    size: {params_m: 98.3, source: hub_metadata}
    finetuning: {recipe_available: false, peft: unknown}
    artifacts:
      official_pretrained: {status: available_official, url: "https://huggingface.co/nvidia/C-RADIOv3-B"}
      automotive_finetuned: {status: not_verified}
      quantized: {status: not_verified}
      onnx_export: {status: requires_local_build, notes: trust_remote_code model – inspect custom code before export.}
      engine: {status: requires_local_build}
    recommendation_context: High-resolution dense features; compare against DINOv2/v3 on far-range small objects.
    caveats:
      - "trust_remote_code executes repository code: pin a revision and review it."
      - "Card says Base ~90M, HF metadata reports 98.3M (likely includes adaptor heads)."
    verification:
      last_verified: 2026-10-30
      status: verified_primary
      method: HF model card read (licence, I/O, resolution) + Hub metadata.
      evidence:
        - {claim: "NVIDIA Open Model License; commercial use stated; I/O contract; patch 16", url: "https://huggingface.co/nvidia/C-RADIOv3-B", source_type: model_card, accessed: 2026-10-30}

  # ---------------------------------------------------------------- 2D detectors
  - id: rt-detrv2-r50vd
    name: RT-DETRv2 ResNet-50vd (COCO)
    aliases: [PekingU/rtdetr_v2_r50vd]
    family: RT-DETR
    role: task_detector
    tasks: [2d_detection]
    modalities: [camera_mono]
    summary: >-
      Real-time DETR: CNN backbone + hybrid encoder + query decoder, NMS-free. Good latency/accuracy
      trade-off and a clean export story because there is no NMS in the graph.
    paper: {title: "RT-DETRv2: Improved Baseline with Bag-of-Freebies for Real-Time Detection Transformer", year: 2024, arxiv: "2407.17140", url: "https://arxiv.org/abs/2407.17140"}
    links:
      code: https://github.com/lyuwenyu/RT-DETR
      model_card: https://huggingface.co/PekingU/rtdetr_v2_r50vd
      weights: https://huggingface.co/PekingU/rtdetr_v2_r50vd
    licensing:
      code_license: Apache-2.0
      weight_license: Apache-2.0
      dataset_terms: Trained on COCO (images under Flickr terms; annotations CC BY 4.0)
      commercial_use: permissive
      gated: false
    io_contract:
      framework: PyTorch / transformers (RtDetrV2ForObjectDetection) or official repo
      input: RGB (B, 3, 640, 640) default; processor rescales to [0,1] (no mean/std by default – check processor config)
      output: logits (B, 300, num_classes) sigmoid scores + pred_boxes (B, 300, 4) normalised cxcywh
      postprocessing: post_process_object_detection -> top-k by score; no NMS
    pretraining: {data: COCO 2017 (80 classes), domain_fit: generic_detection_coco_like}
    size: {params_m: 43.0, source: hub_metadata}
    finetuning:
      recipe_available: true
      peft: experimental
      notes: Full fine-tune on driving classes (BDD100K / nuImages) is the standard path; see recipes/2d_detection.
    artifacts:
      official_pretrained: {status: available_official, url: "https://huggingface.co/PekingU/rtdetr_v2_r50vd"}
      automotive_finetuned: {status: not_verified}
      quantized: {status: not_verified}
      onnx_export: {status: not_verified, url: "https://github.com/lyuwenyu/RT-DETR", notes: "Official repo documents ONNX/TensorRT export scripts (prior knowledge; verify path & opset)."}
      engine: {status: requires_local_build, notes: "Build with trtexec from ONNX; record TRT version, precision, profile."}
    deployment:
      export_formats: [onnx]
      runtimes: [pytorch, onnxruntime, tensorrt]
      known_traps:
        - "Grid-sample / deformable attention ops: check opset and TensorRT plugin support."
        - "INT8 PTQ of the decoder can cost noticeable AP; calibrate on driving images, not COCO."
    recommendation_context: Default 2D driving-camera baseline in this repo (permissive, NMS-free, good export path).
    card: cards/rt-detrv2-r50vd.md
    verification:
      last_verified: 2026-10-30
      status: partially_verified
      method: HF Hub API metadata; export details prior knowledge.
      evidence:
        - {claim: "Apache-2.0, 43.0M params, COCO, RtDetrV2ForObjectDetection", url: "https://huggingface.co/PekingU/rtdetr_v2_r50vd", source_type: hub_metadata, accessed: 2026-10-30}

  - id: yolo11-ultralytics
    name: Ultralytics YOLO11
    aliases: [yolo11n, yolo11s, yolo11m]
    family: YOLO
    role: task_detector
    tasks: [2d_detection, 2d_segmentation]
    modalities: [camera_mono]
    summary: >-
      Widely used one-stage CNN detector family with a turnkey train/export CLI (ONNX, TensorRT,
      OpenVINO). Included as the low-latency reference point – mind the licence.
    links:
      code: https://github.com/ultralytics/ultralytics
      project: https://docs.ultralytics.com/
    licensing:
      code_license: AGPL-3.0 (Enterprise licence offered by Ultralytics)
      weight_license: AGPL-3.0 (per vendor; verify)
      commercial_use: copyleft
      notes: AGPL obligations extend to networked use of modified code. Legal review before any product use.
    io_contract:
      input: RGB letterboxed to 640x640 by default
      output: dense anchor-free predictions -> NMS (in Ultralytics post-processing unless exported with NMS)
    pretraining: {data: COCO, domain_fit: generic_detection_coco_like}
    finetuning: {recipe_available: true, peft: unsupported}
    artifacts:
      official_pretrained: {status: not_verified, url: "https://github.com/ultralytics/ultralytics", notes: Weights auto-download via the package (release assets).}
      automotive_finetuned: {status: not_verified}
      quantized: {status: not_verified, notes: Vendor CLI offers INT8 export for some formats.}
      onnx_export: {status: not_verified, notes: "`yolo export format=onnx` (vendor docs, prior knowledge)."}
      engine: {status: requires_local_build}
    deployment:
      known_traps:
        - "NMS outside the graph unless explicitly exported; letterbox padding must be undone exactly."
    recommendation_context: Latency reference / prototyping. Prefer RT-DETRv2 when licence must be permissive.
    caveats:
      - Version naming moves fast (YOLOv8 -> YOLO11 -> newer). Re-verify the current release and licence at use time.
    verification:
      last_verified: 2026-10-30
      status: not_verified
      method: Prior knowledge only; github.com not reachable from build container.

  - id: grounding-dino-base
    name: Grounding DINO Base
    aliases: [IDEA-Research/grounding-dino-base]
    family: Grounding DINO
    role: open_vocab_detector
    open_vocabulary: true
    tasks: [open_vocabulary_2d_detection]
    modalities: [camera_mono, text]
    summary: >-
      Text-prompted (grounded) detector: DINO detector fused with a BERT text encoder. Detects
      categories named in a prompt; slow but valuable for auto-labelling and long-tail discovery.
    paper: {title: "Grounding DINO: Marrying DINO with Grounded Pre-Training for Open-Set Object Detection", year: 2023, arxiv: "2303.05499", url: "https://arxiv.org/abs/2303.05499"}
    links:
      code: https://github.com/IDEA-Research/GroundingDINO
      model_card: https://huggingface.co/IDEA-Research/grounding-dino-base
      weights: https://huggingface.co/IDEA-Research/grounding-dino-base
    licensing: {code_license: Apache-2.0, weight_license: Apache-2.0, commercial_use: permissive, gated: false, notes: Check pretraining dataset terms for your use.}
    io_contract:
      framework: transformers (AutoModelForZeroShotObjectDetection)
      input: image + text prompt "car. pedestrian. traffic cone." (lower-case, period-separated)
      output: boxes with per-token logits; post_process_grounded_object_detection with box/text thresholds
    pretraining: {data: "Detection + grounding + caption data (O365, GoldG, etc. per paper)", domain_fit: generic_detection_coco_like}
    size: {params_m: 232.8, source: hub_metadata}
    finetuning: {recipe_available: false, peft: experimental}
    artifacts:
      official_pretrained: {status: available_official, url: "https://huggingface.co/IDEA-Research/grounding-dino-base"}
      automotive_finetuned: {status: not_verified}
      quantized: {status: not_verified}
      onnx_export: {status: not_verified, notes: Text branch + deformable attention complicate export; community exports exist (unverified).}
      engine: {status: not_verified}
    recommendation_context: Offline auto-labelling and rare-class mining, not on-vehicle real-time detection.
    verification:
      last_verified: 2026-10-30
      status: partially_verified
      method: HF Hub API metadata.
      evidence:
        - {claim: "Apache-2.0, 232.8M params, zero-shot-object-detection", url: "https://huggingface.co/IDEA-Research/grounding-dino-base", source_type: hub_metadata, accessed: 2026-10-30}

